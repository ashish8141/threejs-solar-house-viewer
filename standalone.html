<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vanilla Three.js - 3D House Model with Rooftop Solar Array</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b0f19;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
    .hud {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.2);
      backdrop-filter: blur(10px);
      padding: 16px 20px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      max-width: 340px;
      pointer-events: auto;
    }
    .hud h1 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #38bdf8;
    }
    .hud p {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.4;
    }
    .controls {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      gap: 8px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.2);
      backdrop-filter: blur(10px);
      padding: 6px;
      border-radius: 12px;
    }
    .btn {
      background: #1e293b;
      color: #e2e8f0;
      border: 1px solid #334155;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn:hover {
      background: #0284c7;
      color: #fff;
      border-color: #38bdf8;
    }
  </style>
  <!-- Three.js and OrbitControls via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
  <div id="canvas-container"></div>

  <div class="hud">
    <h1>3D Residential Model (Vanilla Three.js)</h1>
    <p>Detailed architectural reproduction of aerial satellite property view: 2-story white dwelling, multi-pitch hip roof, rooftop photovoltaic solar panels, and adjacent walled patio.</p>
  </div>

  <div class="controls">
    <button class="btn" onclick="setView('satellite')">Aerial View</button>
    <button class="btn" onclick="setView('front')">Front Elevation</button>
    <button class="btn" onclick="setView('solar')">Solar Roof</button>
    <button class="btn" onclick="setView('patio')">Patio</button>
    <button class="btn" onclick="toggleWireframe()">Toggle Wireframe</button>
  </div>

  <script>
    // --- SCENE SETUP ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f172a);
    scene.fog = new THREE.FogExp2(0x0f172a, 0.015);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(12, 22, 20);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 3, 0);
    controls.maxPolarAngle = Math.PI / 2 - 0.05;

    // --- LIGHTS ---
    const ambientLight = new THREE.AmbientLight(0xe0f2fe, 0.7);
    scene.add(ambientLight);

    const hemiLight = new THREE.HemisphereLight(0xbae6fd, 0x334155, 0.5);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xfffbeb, 2.0);
    dirLight.position.set(15, 25, 12);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    dirLight.shadow.camera.near = 0.5;
    dirLight.shadow.camera.far = 60;
    dirLight.shadow.camera.left = -20;
    dirLight.shadow.camera.right = 20;
    dirLight.shadow.camera.top = 20;
    dirLight.shadow.camera.bottom = -20;
    dirLight.shadow.bias = -0.0002;
    scene.add(dirLight);

    // --- MATERIALS ---
    const materials = {
      wall: new THREE.MeshStandardMaterial({ color: 0xf3f4f6, roughness: 0.85 }),
      trim: new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 0.6 }),
      roof: new THREE.MeshStandardMaterial({ color: 0x272e3d, roughness: 0.75, flatShading: true }),
      solarGlass: new THREE.MeshStandardMaterial({ color: 0x0a192f, roughness: 0.1, metalness: 0.85, emissive: 0x021024 }),
      solarFrame: new THREE.MeshStandardMaterial({ color: 0x94a3b8, roughness: 0.3, metalness: 0.8 }),
      glass: new THREE.MeshStandardMaterial({ color: 0xa5c9eb, roughness: 0.1, metalness: 0.9, transparent: true, opacity: 0.75 }),
      frame: new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.5 }),
      concrete: new THREE.MeshStandardMaterial({ color: 0xd1d5db, roughness: 0.9 }),
      patioFloor: new THREE.MeshStandardMaterial({ color: 0xe5e7eb, roughness: 0.7 }),
      grass: new THREE.MeshStandardMaterial({ color: 0x3f6212, roughness: 0.95 }),
      street: new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.8 })
    };

    // --- GROUND & ENVIRONMENT ---
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(50, 50), materials.grass);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.05;
    ground.receiveShadow = true;
    scene.add(ground);

    const driveway = new THREE.Mesh(new THREE.PlaneGeometry(4.5, 9.5), materials.concrete);
    driveway.rotation.x = -Math.PI / 2;
    driveway.position.set(-5.5, -0.03, 8);
    driveway.receiveShadow = true;
    scene.add(driveway);

    // --- MAIN HOUSE GROUP ---
    const houseGroup = new THREE.Group();
    houseGroup.position.set(-2, 0, -1);
    scene.add(houseGroup);

    // Foundation
    const foundation = new THREE.Mesh(new THREE.BoxGeometry(9.2, 0.5, 11.2), materials.concrete);
    foundation.position.y = 0.25;
    foundation.castShadow = true;
    foundation.receiveShadow = true;
    houseGroup.add(foundation);

    // 1st & 2nd Floor Walls
    const firstFloor = new THREE.Mesh(new THREE.BoxGeometry(9, 2.6, 11), materials.wall);
    firstFloor.position.y = 1.8;
    firstFloor.castShadow = true;
    firstFloor.receiveShadow = true;
    houseGroup.add(firstFloor);

    const midTrim = new THREE.Mesh(new THREE.BoxGeometry(9.15, 0.15, 11.15), materials.trim);
    midTrim.position.y = 3.15;
    houseGroup.add(midTrim);

    const secondFloor = new THREE.Mesh(new THREE.BoxGeometry(9, 2.5, 11), materials.wall);
    secondFloor.position.y = 4.45;
    secondFloor.castShadow = true;
    secondFloor.receiveShadow = true;
    houseGroup.add(secondFloor);

    const eaves = new THREE.Mesh(new THREE.BoxGeometry(9.8, 0.25, 11.8), materials.trim);
    eaves.position.y = 5.75;
    houseGroup.add(eaves);

    // HIP ROOF GEOMETRY
    function createHipRoofGeometry(w, l, h, rl) {
      const geom = new THREE.BufferGeometry();
      const vertices = new Float32Array([
        -w, 0, -l,   w, 0, -l,   0, h, -rl,
         w, 0, -l,   w, 0,  l,   0, h,  rl,
         w, 0, -l,   0, h,  rl,  0, h, -rl,
         w, 0,  l,  -w, 0,  l,   0, h,  rl,
        -w, 0,  l,  -w, 0, -l,   0, h, -rl,
        -w, 0,  l,   0, h, -rl,  0, h,  rl,
        -w, 0, -l,   w, 0,  l,   w, 0, -l,
        -w, 0, -l,  -w, 0,  l,   w, 0,  l,
      ]);
      geom.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
      geom.computeVertexNormals();
      return geom;
    }

    const mainRoof = new THREE.Mesh(createHipRoofGeometry(4.8, 5.8, 3.2, 1.6), materials.roof);
    mainRoof.position.y = 5.8;
    mainRoof.castShadow = true;
    mainRoof.receiveShadow = true;
    houseGroup.add(mainRoof);

    // Front Dormer / Projection
    const frontProj = new THREE.Mesh(new THREE.BoxGeometry(4.2, 2.6, 3.4), materials.wall);
    frontProj.position.set(1.4, 3.8, 4.2);
    frontProj.castShadow = true;
    houseGroup.add(frontProj);

    const frontProjRoof = new THREE.Mesh(createHipRoofGeometry(2.3, 1.9, 1.6, 0.5), materials.roof);
    frontProjRoof.position.set(1.4, 5.1, 4.2);
    frontProjRoof.castShadow = true;
    houseGroup.add(frontProjRoof);

    // Windows
    function addWindow(x, y, z, w, h, rotY = 0) {
      const wg = new THREE.Group();
      wg.position.set(x, y, z);
      wg.rotation.y = rotY;

      const f = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.1), materials.frame);
      const g = new THREE.Mesh(new THREE.BoxGeometry(w - 0.15, h - 0.15, 0.06), materials.glass);
      g.position.z = 0.02;
      wg.add(f, g);
      houseGroup.add(wg);
    }

    addWindow(-2.2, 1.8, 5.55, 2.2, 1.6);
    addWindow(-2.2, 4.5, 5.55, 2.0, 1.5);
    addWindow(2.2, 4.5, 5.55, 1.8, 1.4);
    addWindow(4.55, 4.5, -1.8, 1.6, 1.4, Math.PI / 2);
    addWindow(4.55, 1.8, -1.8, 1.8, 1.5, Math.PI / 2);
    addWindow(-4.55, 4.5, 0.5, 1.6, 1.4, -Math.PI / 2);

    // SOLAR PANELS
    function addSolarPanel(x, y, z, rx, ry, rz) {
      const p = new THREE.Group();
      p.position.set(x, y, z);
      p.rotation.set(rx, ry, rz);
      const frame = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.05, 1.9), materials.solarFrame);
      const glass = new THREE.Mesh(new THREE.BoxGeometry(1.22, 0.03, 1.82), materials.solarGlass);
      glass.position.y = 0.02;
      p.add(frame, glass);
      houseGroup.add(p);
    }

    // South/Front facing roof slope panels
    addSolarPanel(-2.4, 6.75, 2.9, -0.52, 0, 0);
    addSolarPanel(-0.9, 6.75, 2.9, -0.52, 0, 0);
    addSolarPanel(0.6, 6.75, 2.9, -0.52, 0, 0);
    addSolarPanel(2.1, 6.75, 2.9, -0.52, 0, 0);
    addSolarPanel(-1.8, 7.6, 1.6, -0.52, 0, 0);
    addSolarPanel(-0.3, 7.6, 1.6, -0.52, 0, 0);
    addSolarPanel(1.2, 7.6, 1.6, -0.52, 0, 0);

    // East side slope panels
    addSolarPanel(2.8, 6.9, -1.8, 0, 0, -0.56);
    addSolarPanel(2.8, 6.9, 0.2, 0, 0, -0.56);
    addSolarPanel(1.7, 7.8, -0.8, 0, 0, -0.56);
    addSolarPanel(1.7, 7.8, 1.0, 0, 0, -0.56);

    // --- ENCLOSED PATIO / COURTYARD ---
    const patioGroup = new THREE.Group();
    patioGroup.position.set(6.5, 0, -1);
    scene.add(patioGroup);

    const patioFloor = new THREE.Mesh(new THREE.BoxGeometry(7.8, 0.3, 10.6), materials.patioFloor);
    patioFloor.position.y = 0.15;
    patioFloor.receiveShadow = true;
    patioGroup.add(patioFloor);

    // High privacy walls
    const northWall = new THREE.Mesh(new THREE.BoxGeometry(7.8, 2.8, 0.25), materials.wall);
    northWall.position.set(0, 1.6, -5.2);
    northWall.castShadow = true;
    patioGroup.add(northWall);

    const eastWall = new THREE.Mesh(new THREE.BoxGeometry(0.25, 2.8, 10.6), materials.wall);
    eastWall.position.set(3.8, 1.6, 0);
    eastWall.castShadow = true;
    patioGroup.add(eastWall);

    const southWall = new THREE.Mesh(new THREE.BoxGeometry(7.8, 2.8, 0.25), materials.wall);
    southWall.position.set(0, 1.6, 5.2);
    southWall.castShadow = true;
    patioGroup.add(southWall);

    // --- CAMERA VIEWPOINTS ---
    function setView(view) {
      if (view === 'satellite') {
        camera.position.set(10, 22, 18);
        controls.target.set(0, 3, 0);
      } else if (view === 'front') {
        camera.position.set(0, 3.5, 18);
        controls.target.set(0, 3, 0);
      } else if (view === 'solar') {
        camera.position.set(3, 14, 8);
        controls.target.set(-1, 7, 0);
      } else if (view === 'patio') {
        camera.position.set(14, 5, 4);
        controls.target.set(6, 2, -1);
      }
      controls.update();
    }

    let wireframe = false;
    function toggleWireframe() {
      wireframe = !wireframe;
      Object.values(materials).forEach(m => m.wireframe = wireframe);
    }

    // --- ANIMATION LOOP ---
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // Resize Handler
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
